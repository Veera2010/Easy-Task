<app-header></app-header>
<main>
  <ul id="users">
    @for(user of users; track user.id){
       <li>
      <app-user [user]="user" (selectedUser)="onUserClick($event)"/>
    </li>
    } 
  </ul>

  @if(selectedUserDetails)
  {
    <app-tasks [userId]="selectedUserDetails.id" [name]="selectedUserDetails.name"/>
  }
  @else{
    <p id="fallback"> Please select the user to see their Tasks !! </p>
  }
  
  </main>
